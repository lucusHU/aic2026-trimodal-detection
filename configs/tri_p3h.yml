# 涓夋ā鎬佸疄楠?v2锛氬彧璁緟鍔╂敮璺紙鍐荤粨棰勮缁冮儴鍒嗭級
#
# 渚濇嵁锛坴1 瀹炴祴澶辫触鐨勫師鍥狅級锛?#   v1 鐢?base lr 6e-5 鍘诲井璋冧竴涓凡缁忔敹鏁涚殑妯″瀷 鈫?106 姝ュ悗 val 浠?0.5660 鎺夊埌 0.5376锛?#   骞跺湪 0.538 鍗℃涓嶅洖鍗囥€傝繖鏄€屼粠鏀舵暃鏉冮噸鍑哄彂鐨勭伨闅炬€ф紓绉汇€嶏紝涓嶆槸铻嶅悎鏈韩鐨勯棶棰樸€?#
# v2 鍋氭硶 = 瀹樻柟璧涢鍙傝€冩枃鐚?[5]锛圧DTTrack, NeurIPS 2025 D&B锛変笌 MCF 鐨勫仛娉曪細
#   鍐荤粨 RGB 棰勮缁冧富浣擄紝鍙缁冩柊澧炵殑杈呭姪妯℃€佹敮璺?+ 闆跺垵濮嬪寲闂ㄦ帶銆?#   棰勮缁冮儴鍒?lr 鍘嬪埌 1e-6锛堢瓑鏁堝喕缁撲絾淇濈暀鏁板€肩ǔ瀹氾級锛宎ux 鏀矾 lr 5e-4銆?#   鍔犺浇 tri_init.pth 鍚庣 0 姝ヤ笌鍘?RGB 妯″瀷杈撳嚭瀹屽叏涓€鑷达紙宸查獙璇?0.000e+00锛夈€?# ==========================================================

output_dir: ./output/tri_p3h

task: detection
eval_spatial_size: [800, 800]

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox',]

num_classes: 12
remap_mscoco_category: False

model: TriModalDFINE

# =========================
# 鏁版嵁闆嗭紙涓夋ā鎬侊紝5 閫氶亾锛?# =========================

train_dataloader:
  type: DataLoader

  dataset:
    type: TriCocoDetection
    img_folder: dataset/images/train
    ann_file: dataset/annotations/instances_train.json
    return_masks: False
    aux_folders: ['dataset/tri/train/infrared', 'dataset/tri/train/depth']

    transforms:
      type: Compose
      ops:
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [800, 800], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: 0
        ops: ['RandomZoomOut', 'RandomIoUCrop']

  shuffle: True
  num_workers: 4
  drop_last: True

  total_batch_size: 16

  collate_fn:
    type: BatchImageCollateFunction
    stop_epoch: 8
    ema_restart_decay: 0.9999
    base_size: 800
    base_size_repeat: 4


val_dataloader:
  type: DataLoader

  dataset:
    type: TriCocoDetection
    img_folder: dataset/images/val
    ann_file: dataset/annotations/instances_val.json
    return_masks: False
    aux_folders: ['dataset/tri/val/infrared', 'dataset/tri/val/depth']

    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [800, 800], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}

  shuffle: False
  num_workers: 4

  total_batch_size: 16

  collate_fn:
    type: BatchImageCollateFunction


# =========================
# 妯″瀷
# =========================

TriModalDFINE:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer
  aux_in_ch: 2
  aux_width: 32
  gate_bias: 1.0

HGNetv2:
  name: 'B4'
  return_idx: [1, 2, 3]

  freeze_stem_only: True
  freeze_at: 0
  freeze_norm: True

  pretrained: False


# =========================
# 浼樺寲鍣細棰勮缁冧富浣撶瓑鏁堝喕缁擄紝鍙湁 aux 鏀矾鐪熸鍦ㄥ
# =========================

optimizer:
  type: AdamW

  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0000125

    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

    -
      params: '^(?=.*(?:aux_stem|aux_s2|aux_s3|aux_s4|aux_s5|fuse)).*$'
      lr: 0.0005
      weight_decay: 0.

  lr: 0.00006

  betas: [0.9, 0.999]
  weight_decay: 0.000125


# =========================
# 璁粌杞暟
# =========================

epochs: 26

ema:
  warmups: 0

lr_warmup_scheduler:
  warmup_duration: 0



