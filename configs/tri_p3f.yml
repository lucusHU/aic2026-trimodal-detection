__include__: [
  '../../D-FINE/configs/runtime.yml',
  '../../D-FINE/configs/dfine/include/dataloader_800.yml',
  '../../D-FINE/configs/dfine/include/optimizer.yml',
  '../../D-FINE/configs/dfine/include/dfine_hgnetv2_800.yml',
]

# ==========================================================
# 三模态实验 v2：只训辅助支路（冻结预训练部分）
#
# 依据（v1 实测失败的原因）：
#   v1 用 base lr 6e-5 去微调一个已经收敛的模型 → 106 步后 val 从 0.5660 掉到 0.5376，
#   并在 0.538 卡死不回升。这是「从收敛权重出发的灾难性漂移」，不是融合本身的问题。
#
# v2 做法 = 官方赛题参考文献 [5]（RDTTrack, NeurIPS 2025 D&B）与 MCF 的做法：
#   冻结 RGB 预训练主体，只训练新增的辅助模态支路 + 零初始化门控。
#   预训练部分 lr 压到 1e-6（等效冻结但保留数值稳定），aux 支路 lr 5e-4。
#   加载 tri_init.pth 后第 0 步与原 RGB 模型输出完全一致（已验证 0.000e+00）。
# ==========================================================

output_dir: ./output/tri_p3f

task: detection
eval_spatial_size: [800, 800]

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox',]

num_classes: 12
remap_mscoco_category: False

model: TriModalDFINE

# =========================
# 数据集（三模态，5 通道）
# =========================

train_dataloader:
  type: DataLoader

  dataset:
    type: TriCocoDetection
    img_folder: dataset/images/train
    ann_file: dataset/annotations/instances_train.json
    return_masks: False
    aux_folders: ['dataset/tri/train/infrared', 'dataset/tri/train/depth']

    transforms:
      type: Compose
      ops:
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [800, 800], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: 10
        ops: ['RandomZoomOut', 'RandomIoUCrop']

  shuffle: True
  num_workers: 4
  drop_last: True

  total_batch_size: 16

  collate_fn:
    type: BatchImageCollateFunction
    stop_epoch: 10
    ema_restart_decay: 0.9999
    base_size: 800
    base_size_repeat: 4


val_dataloader:
  type: DataLoader

  dataset:
    type: TriCocoDetection
    img_folder: dataset/images/val
    ann_file: dataset/annotations/instances_val.json
    return_masks: False
    aux_folders: ['dataset/tri/val/infrared', 'dataset/tri/val/depth']

    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [800, 800], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}

  shuffle: False
  num_workers: 4

  total_batch_size: 16

  collate_fn:
    type: BatchImageCollateFunction


# =========================
# 模型
# =========================

TriModalDFINE:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer
  aux_in_ch: 2
  aux_width: 32
  gate_bias: 1.0

HGNetv2:
  name: 'B4'
  return_idx: [1, 2, 3]

  freeze_stem_only: True
  freeze_at: 0
  freeze_norm: True

  pretrained: False


# =========================
# 优化器：预训练主体等效冻结，只有 aux 支路真正在学
# =========================

optimizer:
  type: AdamW

  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.000001

    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

    -
      params: '^(?=.*(?:aux_stem|aux_s2|aux_s3|aux_s4|aux_s5|fuse)).*$'
      lr: 0.0005
      weight_decay: 0.

  lr: 0.000001

  betas: [0.9, 0.999]
  weight_decay: 0.000125


# =========================
# 训练轮数
# =========================

epochs: 14

ema:
  warmups: 0

lr_warmup_scheduler:
  warmup_duration: 0
