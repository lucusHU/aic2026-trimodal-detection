__include__: [
  '../../D-FINE/configs/runtime.yml',
  '../../D-FINE/configs/dfine/include/dataloader_800.yml',
  '../../D-FINE/configs/dfine/include/optimizer.yml',
]

# =========================
# P2小目标检测头实验（豆包+Codex）
# 从seed1热启动，加P2(stride=4)层
# =========================

output_dir: ./output/p2_800

task: detection
eval_spatial_size: [800, 800]

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox',]

num_classes: 12
remap_mscoco_category: False

model: DFINE
criterion: DFINECriterion
postprocessor: DFINEPostProcessor

use_focal_loss: True

DFINE:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer

# =========================
# Backbone: 加stage1(128ch, stride=4) = P2
# =========================
HGNetv2:
  name: 'B4'
  return_idx: [0, 1, 2, 3]
  freeze_stem_only: True
  freeze_at: 0
  freeze_norm: True
  pretrained: False

# =========================
# Encoder: 4个尺度
# =========================
HybridEncoder:
  in_channels: [128, 512, 1024, 2048]
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 256
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.
  enc_act: 'gelu'
  expansion: 1.0
  depth_mult: 1
  act: 'silu'

# =========================
# Decoder: 4个level
# =========================
DFINETransformer:
  feat_channels: [256, 256, 256, 256]
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 256
  num_levels: 4
  num_layers: 6
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points: [3, 3, 6, 3]
  cross_attn_method: default
  query_select_method: default

DFINEPostProcessor:
  num_top_queries: 300

DFINECriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ['vfl', 'boxes', 'local']
  alpha: 0.75
  gamma: 2.0
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0

# =========================
# 数据集
# =========================
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: dataset/images/train
    ann_file: dataset/annotations/instances_train.json
    return_masks: False
    transforms:
      type: Compose
      policy:
        epoch: 20
  shuffle: True
  num_workers: 4
  drop_last: True
  total_batch_size: 2
  collate_fn:
    type: BatchImageCollateFunction
    stop_epoch: 20
    ema_restart_decay: 0.9999
    base_size_repeat: 4

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: dataset/images/val
    ann_file: dataset/annotations/instances_val.json
    return_masks: False
    transforms:
      type: Compose
  shuffle: False
  num_workers: 4
  total_batch_size: 2
  collate_fn:
    type: BatchImageCollateFunction

# =========================
# 优化器：从seed1热启动，小lr微调
# =========================
optimizer:
  type: AdamW
  params:
    - params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.000005
    - params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.000125

# =========================
# 训练轮数：20 epoch
# =========================
epochs: 20

ema:
  warmups: 0

lr_warmup_scheduler:
  warmup_duration: 0
